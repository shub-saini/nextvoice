name: Deploy to EC2

on:
    push:
        branches:
            - main
            - master

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Deploy to EC2
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.EC2_HOST }}
                  username: ${{ secrets.EC2_USERNAME }}
                  key: ${{ secrets.EC2_SSH_KEY }}
                  script: |
                      # Go to app directory
                      cd /home/${{ secrets.EC2_USERNAME }}/app || mkdir -p /home/${{ secrets.EC2_USERNAME }}/app
                      cd /home/${{ secrets.EC2_USERNAME }}/app

                      # Clone or pull
                      if [ -d ".git" ]; then
                        git fetch --all
                        git reset --hard origin/main
                        git pull origin main
                      else
                        git clone https://github.com/${{ github.repository }} .
                      fi

                      # Create .env files
                      cat > apps/web/.env.local << 'EOF'
                      CLERK_SECRET_KEY=${{ secrets.WEB_CLERK_SECRET_KEY }}
                      NEXT_PUBLIC_CLERK_FRONTEND_API_URL=${{ secrets.WEB_NEXT_PUBLIC_CLERK_FRONTEND_API_URL }}
                      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.WEB_NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
                      NEXT_PUBLIC_CLERK_SIGN_IN_URL=${{ secrets.WEB_NEXT_PUBLIC_CLERK_SIGN_IN_URL }}
                      NEXT_PUBLIC_CLERK_SIGN_UP_URL=${{ secrets.WEB_NEXT_PUBLIC_CLERK_SIGN_UP_URL }}
                      NEXT_PUBLIC_CONVEX_URL=${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
                      NEXT_PUBLIC_SIGN_IN_FALLBACK_REDIRECT_URL=${{ secrets.WEB_NEXT_PUBLIC_SIGN_IN_FALLBACK_REDIRECT_URL }}
                      NEXT_PUBLIC_SIGN_UP_FALLBACK_REDIRECT_URL=${{ secrets.WEB_NEXT_PUBLIC_SIGN_UP_FALLBACK_REDIRECT_URL }}
                      SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
                      EOF

                      cat > apps/widget/.env.local << 'EOF'
                      CLERK_SECRET_KEY=${{ secrets.WIDGET_CLERK_SECRET_KEY }}
                      NEXT_PUBLIC_CLERK_FRONTEND_API_URL=${{ secrets.WIDGET_NEXT_PUBLIC_CLERK_FRONTEND_API_URL }}
                      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.WIDGET_NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
                      NEXT_PUBLIC_CLERK_SIGN_IN_URL=${{ secrets.WIDGET_NEXT_PUBLIC_CLERK_SIGN_IN_URL }}
                      NEXT_PUBLIC_CLERK_SIGN_UP_URL=${{ secrets.WIDGET_NEXT_PUBLIC_CLERK_SIGN_UP_URL }}
                      NEXT_PUBLIC_CONVEX_URL=${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
                      NEXT_PUBLIC_SIGN_IN_FALLBACK_REDIRECT_URL=${{ secrets.WIDGET_NEXT_PUBLIC_SIGN_IN_FALLBACK_REDIRECT_URL }}
                      NEXT_PUBLIC_SIGN_UP_FALLBACK_REDIRECT_URL=${{ secrets.WIDGET_NEXT_PUBLIC_SIGN_UP_FALLBACK_REDIRECT_URL }}
                      SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
                      EOF

                      # Install pnpm if not exists
                      npm install -g pnpm pm2 || true

                      # Install dependencies
                      pnpm install || true

                      # Kill existing processes
                      pm2 delete all || true
                      pkill -f "next dev" || true

                      # Start in DEV MODE - NO BUILD!
                      cd apps/web
                      pm2 start "pnpm dev -- -p 3000" --name web

                      cd ../widget
                      pm2 start "pnpm dev -- -p 3001" --name widget

                      cd ../..
                      pm2 save
